name: Kiosk regressions

on:
  pull_request:
    branches: [main, test/chromium-foundries-retry-20261012]
  push:
    branches: [main, test/chromium-foundries-retry-20261012]

permissions:
  contents: read

jobs:
  kiosk-regression:
    name: Kiosk regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout distro layer
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout BSP source fixtures
        uses: actions/checkout@v6
        with:
          repository: DynamicDevices/meta-dynamicdevices-bsp
          ref: 085a379c5b390af7407bfbb8ebbe60380a10a373
          path: .ci-bsp
          persist-credentials: false
      - name: Prepare Python test dependencies
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip --disable-pip-version-check install Pillow
      - name: Check kiosk startup and configuration
        env:
          BSP_ROOT: ${{ github.workspace }}/.ci-bsp
        run: |
          .ci-venv/bin/python -B -m unittest discover -s tests -v
          .ci-venv/bin/python -B -m unittest discover -s recipes-graphics/dd-kiosk-browser -p 'test_*.py' -v
      - name: Check touch, gestures and recipe wiring
        run: |
          node scripts/test-jaguar-touch-test.mjs
          node recipes-graphics/jaguar-touch-test/test-jaguar-touch-test.cjs
      - name: Check launcher syntax
        run: |
          sh -n recipes-graphics/dd-kiosk-browser/dd-kiosk-browser/dd-kiosk-browser
          sh -n recipes-graphics/jaguar-touch-test/jaguar-touch-test/jaguar-touch-test
