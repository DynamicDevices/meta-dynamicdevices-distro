name: yocto-lens static scan

on:
  push:
    branches: [main]
    paths:
      - '**/*.bb'
      - '**/*.bbappend'
      - '**/*.inc'
      - 'conf/**'
      - 'tests/**'
      - '.github/workflows/yocto-lens.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.bb'
      - '**/*.bbappend'
      - '**/*.inc'
      - 'conf/**'
      - 'tests/**'
      - '.github/workflows/yocto-lens.yml'
  workflow_dispatch:
    inputs:
      fail_on_high:
        description: 'Fail the job if any HIGH severity finding is reported'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  yocto-lens:
    name: yocto-lens (BSP + distro)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout distro layer
        uses: actions/checkout@v4

      - name: Checkout BSP layer
        uses: actions/checkout@v4
        with:
          repository: DynamicDevices/meta-dynamicdevices-bsp
          path: meta-dynamicdevices-bsp
          ref: main

      - name: Check layer and display-splash fixtures
        env:
          BSP_ROOT: ${{ github.workspace }}/meta-dynamicdevices-bsp
        run: |
          python3 -m venv "${RUNNER_TEMP}/display-splash-tests"
          "${RUNNER_TEMP}/display-splash-tests/bin/pip" install Pillow==12.1.1
          "${RUNNER_TEMP}/display-splash-tests/bin/python" -m unittest discover -s tests -v

      - name: Check display filter with pinned U-Boot regex engine
        run: |
          source_dir="${RUNNER_TEMP}/uboot-display-slre"
          mkdir -p "${source_dir}/lib" "${source_dir}/include"
          pinned="https://raw.githubusercontent.com/foundriesio/u-boot/adbe53791d8f3cc2d7ecf2a3f308494d561def9e"
          curl --fail --location --silent --show-error "${pinned}/lib/slre.c" -o "${source_dir}/lib/slre.c"
          curl --fail --location --silent --show-error "${pinned}/include/slre.h" -o "${source_dir}/include/slre.h"
          python3 meta-dynamicdevices-bsp/scripts/test-display-bootargs-slre.py --source "${source_dir}"

      - name: Run yocto-lens static scan
        working-directory: meta-dynamicdevices-bsp
        env:
          DISTRO_ROOT: ${{ github.workspace }}
          OUTPUT_DIR: ${{ runner.temp }}/yocto-lens
          FAIL_ON_HIGH: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_on_high && '1' || '0' }}
        run: ./scripts/yocto-lens-ci.sh

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yocto-lens-json
          path: ${{ runner.temp }}/yocto-lens/yocto-lens-dd-layers.json
          if-no-files-found: error

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yocto-lens-sarif
          path: ${{ runner.temp }}/yocto-lens/yocto-lens-dd-layers.sarif
          if-no-files-found: error
