#
# Shared AESL-capable LmP clients (aklite/composectl with compose_apps_proxy).
#
# Portal bind (DEVICE_API, gateway conf.d, TUF root, register token, tag) lives in
# the private factory meta-subscriber-overrides — see:
#   active-esl/factory-aesl-lab-meta-subscriber-overrides
#   lab-infra docs/foundries-aesl-multi-factory.md
#
# Do not flip live vixdt SaaS independently of its Factory Definition.
# Build with DISTRO=lmp-dynamicdevices-aesl only for AESL-capable client images.
#

require conf/distro/lmp-dynamicdevices.conf

DISTRO = "lmp-dynamicdevices-aesl"
DISTROOVERRIDES = "lmp:lmp-dynamicdevices:aesl-ota:lmp-dynamicdevices-aesl"
DISTRO_NAME = "Linux-microPlatform Dynamic Devices AESL OTA"

# Gate shared client SRCREV bumps only (aktualizr/composectl :aesl-ota)
DISTRO_FEATURES:append = " aesl-ota"
