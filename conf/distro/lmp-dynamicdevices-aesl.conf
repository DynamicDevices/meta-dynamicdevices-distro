#
# Shared AESL-capable LmP clients (aklite/composectl with compose_apps_proxy).
#
# Portal bind (DEVICE_API, gateway conf.d, TUF root, register token, tag) lives in
# the private factory meta-subscriber-overrides — see:
#   active-esl/factory-aesl-lab-meta-subscriber-overrides
#   lab-infra docs/foundries-aesl-multi-factory.md
#
# Do not flip live vixdt SaaS (lmp-dynamicdevices-headless).
# Build with DISTRO=lmp-dynamicdevices-aesl only for AESL-capable client images.
#

require conf/distro/lmp-dynamicdevices-headless.conf

DISTRO = "lmp-dynamicdevices-aesl"
DISTROOVERRIDES = "lmp:lmp-dynamicdevices:lmp-dynamicdevices-headless:aesl-ota:lmp-dynamicdevices-aesl"
DISTRO_NAME = "Linux-microPlatform Dynamic Devices AESL OTA"

# Gate shared client SRCREV bumps only (aktualizr/composectl :aesl-ota)
DISTRO_FEATURES:append = " aesl-ota"

# Binary reproducibility (AESL only — does not flip SaaS headless)
# SOURCE_DATE_EPOCH is already set via lmp-dynamicdevices-headless.conf
# (1609459200). Force the OE reproducible path for package/task timestamps.
#
# Limits (honest): OSTree commit metadata, WIC/OTA assemble, signing, and
# any recipe that embeds build-host entropy will still differ across two
# clean builds. Verify with two clean builds + compare deploy hashes —
# expect rootfs packages closer; do not assume bit-identical .ostree/.wic.
BUILD_REPRODUCIBLE_BINARIES = "1"
INHERIT += "reproducible_build"
