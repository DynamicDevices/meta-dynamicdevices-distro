# Compatibility entry point for existing Factory Definitions. Select the
# actual headed distro for explicitly interactive display machines; leave
# genuinely headless/static e-ink machines on their existing policy.
DD_LEGACY_DISTRO_PROFILE = "${@bb.utils.contains('MACHINE_FEATURES', 'display-multimedia', 'display', 'headless', d)}"
require conf/distro/include/lmp-dynamicdevices-${DD_LEGACY_DISTRO_PROFILE}-compat.inc
