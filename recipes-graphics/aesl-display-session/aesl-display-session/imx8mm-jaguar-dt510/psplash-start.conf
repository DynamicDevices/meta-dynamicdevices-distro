[Unit]
# Valid handover has no fbdev device. Do not wait for a device which the
# kernel deliberately does not create, or delay Weston by a device timeout.
Wants=
After=
After=systemd-udev-trigger.service

[Service]
ExecCondition=/usr/libexec/aesl-psplash-needed
ExecStart=
ExecStart=/usr/libexec/aesl-psplash-start
TimeoutStartSec=20s
StandardOutput=journal
StandardError=journal
